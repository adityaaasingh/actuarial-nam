[project]
name = "anam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aditya Singh", email = "adityasingh5467@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cryptography<49",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "numpy<2",
    "pandas>=2.3.3",
    "pandera>=0.36.0",
    "pyarrow==21.0.0",
    "pyreadr>=0.5.9",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "statsmodels>=0.15.0",
    "torch==2.2.2",
]

[project.scripts]
anam = "anam:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]


[tool.ruff.lint.isort]
known-first-party = ["anam"]
